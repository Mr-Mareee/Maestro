[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log

[program:sshd]
command=/usr/sbin/sshd -D
autorestart=true
priority=10
stdout_logfile=/var/log/sshd_supervisord.log
stderr_logfile=/var/log/sshd_supervisord.err

[program:apache2]
command=/usr/sbin/apachectl -D FOREGROUND
autorestart=true
priority=20
stdout_logfile=/var/log/apache2_supervisord.log
stderr_logfile=/var/log/apache2_supervisord.err
